<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="Loyola Global Works — Connecting Talent. Powering Business."/><title>Loyola Global Works</title><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap');:root{--obs:#111;--graph:#292929;--slate:#555;--silver:#a6a6a6;--plat:#d9d9d9;--white:#fff;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',Arial,sans-serif;--max:1240px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--obs);font-family:var(--sans)}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}.container{width:min(calc(100% - 48px),var(--max));margin:auto}.eyebrow{font-size:11px;letter-spacing:.24em;font-weight:600;text-transform:uppercase}.serif{font-family:var(--serif)}.rule{height:1px;background:var(--plat)}.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--plat)}.navin{height:82px;display:flex;align-items:center;justify-content:space-between;gap:28px}.brand img{width:172px;height:auto;display:block}.darklogo{filter:brightness(0) invert(1)}.navlinks{display:flex;align-items:center;gap:30px;font-size:11px;letter-spacing:.13em;font-weight:600}.navlinks a:hover{text-decoration:underline;text-underline-offset:7px}.cta{border:1px solid var(--obs);background:var(--obs);color:#fff;padding:13px 19px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.cta.light{background:#fff;color:var(--obs)}.menu{display:none;background:none;border:0;font-size:22px}.hero{min-height:var(--hero-height,650px);background:var(--obs);background-image:var(--hero-bg,none);background-size:var(--hero-size,cover);background-position:var(--hero-position,center center);color:#fff;position:relative;overflow:hidden}.hero:before{content:'';position:absolute;inset:0;background:rgba(17,17,17,var(--hero-overlay,.55));z-index:0;pointer-events:none}.hero:after{content:"";position:absolute;inset:auto -10% -35% 42%;height:750px;border-radius:50%;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 80px rgba(255,255,255,.025),0 0 0 160px rgba(255,255,255,.018),0 0 0 240px rgba(255,255,255,.012);transform:rotate(-12deg)}.hero .container{min-height:var(--hero-height,650px);display:grid;grid-template-columns:1.08fr .92fr;align-items:center;position:relative;z-index:1}.hero h1{font:600 clamp(56px,7vw,92px)/.86 var(--serif);letter-spacing:-.025em;margin:20px 0 28px;max-width:760px}.hero p{max-width:580px;color:#d6d6d6;font-size:16px;line-height:1.8}.hero-actions{display:flex;gap:14px;margin-top:34px}.hero-logo{justify-self:end;max-height:520px;object-fit:contain;filter:brightness(0) invert(1);opacity:.98}.hero-kicker{color:#fff}.section{padding:105px 0}.section.dark{background:var(--obs);color:#fff}.section-head{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-bottom:48px}.section h2{font:600 clamp(44px,5vw,68px)/.92 var(--serif);margin:12px 0 0;letter-spacing:-.02em}.section-intro{max-width:500px;color:var(--slate);line-height:1.8;font-size:15px}.dark .section-intro{color:#bbb}.services{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--silver);border-bottom:1px solid var(--silver)}.service{min-height:260px;padding:30px 24px;border-right:1px solid var(--plat);position:relative}.dark .service{border-color:#444}.service:last-child{border-right:0}.service-no{font-size:10px;color:var(--silver);letter-spacing:.15em}.service h3{font:600 30px/1.05 var(--serif);margin:70px 0 16px}.service p{font-size:13px;line-height:1.7;color:var(--slate)}.dark .service p{color:#aaa}.team{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.person{border:1px solid var(--plat);padding:18px;background:#fff}.person-photo{aspect-ratio:1/1.05;background:#eee;overflow:hidden;margin-bottom:18px}.person-photo img{width:100%;height:100%;object-fit:cover}.person h3{font:600 27px var(--serif);margin:0}.person p{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--slate);margin:7px 0 0}.person .bio{font-size:12px;line-height:1.6;color:var(--slate);margin-top:14px;text-transform:none;letter-spacing:0}.jobs{display:grid;gap:0;border-top:1px solid var(--obs)}.job{padding:28px 0;border-bottom:1px solid var(--plat);display:grid;grid-template-columns:1.2fr 2fr auto;gap:30px;align-items:center}.job h3{font:600 32px var(--serif);margin:0}.job p{color:var(--slate);font-size:13px;line-height:1.6;margin:0}.job .tag{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:600}.job .apply{white-space:nowrap}.insights{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:1px;background:var(--plat)}.insight{background:#fff;padding:32px;min-height:280px}.insight h3{font:600 34px var(--serif);margin:50px 0 15px}.insight p{font-size:13px;line-height:1.7;color:var(--slate)}.contact{display:grid;grid-template-columns:1fr 1fr;gap:80px}.contact h2{font-size:70px}.contact-form{display:grid;gap:16px}.field{display:grid;gap:8px}.field label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:600}.field input,.field textarea,.field select{border:1px solid var(--plat);padding:15px;background:#fff;outline:0}.field textarea{min-height:130px;resize:vertical}.footer{background:var(--obs);color:#fff;padding:65px 0 28px}.footer-top{display:flex;justify-content:space-between;gap:40px}.footer img{width:220px;filter:brightness(0) invert(1)}.footer p{color:#aaa;font-size:12px;line-height:1.7;max-width:370px}.footer-bottom{border-top:1px solid #333;margin-top:50px;padding-top:20px;display:flex;justify-content:space-between;color:#888;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.admin{min-height:100vh;background:#f5f5f3}.adminbar{background:#111;color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}.adminbar img{width:190px;filter:brightness(0) invert(1)}.admin-layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 70px)}.sidebar{background:#fff;border-right:1px solid var(--plat);padding:25px 16px}.sidebtn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:13px 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.sidebtn.active,.sidebtn:hover{background:#111;color:#fff}.adminmain{padding:35px;max-width:1200px}.admin-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.admin-title h1{font:600 48px var(--serif);margin:0}.panel{background:#fff;border:1px solid var(--plat);padding:25px;margin-bottom:20px}.panel h2{font:600 30px var(--serif);margin:0 0 18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin .field input,.admin .field textarea,.admin .field select{background:#fafafa}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--plat);padding:10px 0}.smallbtn{border:1px solid #111;background:#111;color:#fff;padding:10px 13px;font-size:10px;text-transform:uppercase;letter-spacing:.1em}.smallbtn.alt{background:#fff;color:#111}.danger{color:#9b111e}.upload{border:1px dashed #aaa;padding:20px;text-align:center;font-size:11px;color:#666}.upload input{margin:10px 0}.status{font-size:10px;text-transform:uppercase;letter-spacing:.14em}.status.ok{color:#176b3a}.login{min-height:100vh;display:grid;place-items:center;background:#111}.loginbox{width:min(430px,calc(100% - 40px));background:#fff;padding:38px}.loginbox img{width:200px;margin-bottom:30px}.loginbox h1{font:600 42px var(--serif);margin:0 0 25px}.jobpage{padding:80px 0}.jobhero{background:#111;color:#fff;padding:70px 0}.jobhero h1{font:600 clamp(48px,7vw,82px) var(--serif);margin:15px 0}.jobmeta{display:flex;gap:25px;color:#aaa;font-size:11px;text-transform:uppercase;letter-spacing:.13em}.applywrap{display:grid;grid-template-columns:1fr 380px;gap:80px}.applywrap h2{font:600 48px var(--serif)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid .full{grid-column:1/-1}.notice{padding:15px;background:#f2f2f0;font-size:12px;line-height:1.6}@media(max-width:950px){.navlinks{display:none}.menu{display:block}.hero .container{grid-template-columns:1fr}.hero-logo{display:none}.services{grid-template-columns:1fr 1fr}.service:nth-child(2n){border-right:0}.team{grid-template-columns:1fr 1fr}.insights{grid-template-columns:1fr}.contact,.applywrap{grid-template-columns:1fr}.admin-layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--plat)}.sidebtn{white-space:nowrap}.adminmain{padding:20px}.job{grid-template-columns:1fr}.formgrid,.grid2{grid-template-columns:1fr}}@media(max-width:600px){.container{width:min(calc(100% - 30px),var(--max))}.navin{height:68px}.brand img{width:145px}.hero,.hero .container{min-height:620px}.hero h1{font-size:58px}.hero-actions{flex-direction:column;align-items:stretch}.section{padding:70px 0}.section-head{display:block}.services,.team{grid-template-columns:1fr}.service{border-right:0!important;border-bottom:1px solid var(--plat)}.service:last-child{border-bottom:0}.contact h2{font-size:55px}.footer-top,.footer-bottom{display:block}.footer-bottom span{display:block;margin-top:10px}}</style></head><body><div id="root"></div><script>const KEY='lgw-cms-v1';const defaults={settings:{heroTitle:'CONNECTING TALENT. POWERING BUSINESS.',heroText:'Loyola Global Works helps businesses build stronger teams through exceptional global talent and dependable outsourcing solutions.',heroImage:'',heroKicker:'GLOBAL TALENT. REAL IMPACT.',heroOverlay:55,heroPosition:'center center',heroSize:'cover',heroHeight:760,heroLogoSize:520,heroLogoShow:true,heroPrimary:'EXPLORE OUR SERVICES',heroSecondary:'MEET OUR TEAM',email:'hello@loyolaglobalworks.com',phone:'+63 912 345 6789',address:'Makati City, Philippines',logoPrimary:'/logo.svg',logoMonogram:'/logo.svg',logoWhite:'/logo.svg'},team:[{name:'Christopher Loyola',role:'Founder & CEO',bio:'Building a premium global workforce company centered on people, dependable operations, and technology.',image:''},{name:'Operations Lead',role:'Operations Lead',bio:'Oversees day-to-day delivery, systems, quality, and operational excellence.',image:''},{name:'Talent Director',role:'Talent Director',bio:'Builds talent pipelines and connects exceptional professionals with the right opportunities.',image:''},{name:'Client Success',role:'Client Success',bio:'Keeps client relationships strong through responsive communication and reliable support.',image:''}],jobs:[{id:'1',title:'Virtual Assistant',type:'Remote · Full-time',location:'Global',summary:'Support growing businesses with organized, dependable administrative and executive assistance.',fields:[['Full Name','text',true],['Email Address','email',true],['Phone Number','tel',false],['LinkedIn / Portfolio','url',false],['Tell us about yourself','textarea',true]]},{id:'2',title:'Customer Support Specialist',type:'Remote · Full-time',location:'Global',summary:'Represent client brands with care, consistency, and clear communication.',fields:[['Full Name','text',true],['Email Address','email',true],['Years of experience','text',false],['Resume URL','url',true],['Why are you a strong fit?','textarea',true]]}]};function load(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(!saved)return structuredClone(defaults);return {...structuredClone(defaults),...saved,settings:{...structuredClone(defaults.settings),...(saved.settings||{})},team:saved.team||structuredClone(defaults.team),jobs:saved.jobs||structuredClone(defaults.jobs)}}catch{return structuredClone(defaults)}}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}let db=load();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function logo(white=false,mono=false){const src=mono?(db.settings.logoMonogram||db.settings.logoPrimary):(db.settings.logoPrimary||'/logo.svg');return `<img src="${src}" alt="Loyola Global Works" class="${white?'darklogo':''}">`}function header(){return `<header class="nav"><div class="container navin"><a class="brand" href="/">${logo()}</a><nav class="navlinks"><a href="#services">SERVICES</a><a href="#about">ABOUT</a><a href="#talent">TALENT</a><a href="#insights">INSIGHTS</a><a href="#contact">CONTACT</a><a class="cta" href="#contact">LET'S WORK TOGETHER</a></nav><button class="menu">☰</button></div></header>`}function heroStyle(){const st=db.settings;const bg=st.heroImage?`url(\"${st.heroImage}\")`:'none';const overlay=Math.max(0,Math.min(100,Number(st.heroOverlay??55)))/100;const pos=['center center','center top','center bottom','left center','right center'].includes(st.heroPosition)?st.heroPosition:'center center';const size=['cover','contain','auto'].includes(st.heroSize)?st.heroSize:'cover';const height=Math.max(520,Math.min(1100,Number(st.heroHeight??760)));return `--hero-bg:${bg};--hero-overlay:${overlay};--hero-position:${pos};--hero-size:${size};--hero-height:${height}px`}function home(){return `${header()}<main><section class="hero" style="${heroStyle()}"><div class="container"><div><div class="eyebrow hero-kicker">${esc(db.settings.heroKicker||'GLOBAL TALENT. REAL IMPACT.')}</div><h1>${esc(db.settings.heroTitle)}</h1><p>${esc(db.settings.heroText)}</p><div class="hero-actions"><a class="cta light" href="#services">${esc(db.settings.heroPrimary||'EXPLORE OUR SERVICES')}&nbsp; →</a><a class="cta" href="#talent">${esc(db.settings.heroSecondary||'MEET OUR TEAM')}</a></div></div>${db.settings.heroLogoShow!==false?`<img class="hero-logo" style="width:min(${Math.max(180,Math.min(720,Number(db.settings.heroLogoSize||520)))}px,85%)" src="${db.settings.logoWhite||db.settings.logoMonogram||db.settings.logoPrimary}" alt="LGW">`:''}</div></section><section class="section" id="services"><div class="container"><div class="section-head"><div><div class="eyebrow">WHAT WE DO</div><h2>Global Talent.<br>Local Excellence.</h2></div><p class="section-intro">We build flexible support teams around the way your business actually works.</p></div><div class="services">${[['01','Virtual Assistance','Administrative and executive support designed around your workflow.'],['02','Customer Support','Reliable professionals representing your brand with care and consistency.'],['03','Back-Office Operations','Helping businesses manage essential processes efficiently.'],['04','Creative Services','Design, content, and digital support for growing brands.'],['05','Staffing & Talent Solutions','Connecting businesses with skilled professionals ready to contribute.']].map(x=>`<article class="service"><span class="service-no">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></div></section><section class="section dark" id="about"><div class="container"><div class="section-head"><div><div class="eyebrow">WHY LOYOLA GLOBAL WORKS</div><h2>Built Around Your Business.</h2></div><p class="section-intro">Loyola Global Works connects businesses with exceptional talent and reliable operational support, helping organizations scale through people, expertise, and technology.</p></div><div class="insights">${[['PEOPLE','Talent that fits.','We connect you with professionals who can contribute from day one.'],['OPERATIONS','Support that works.','Flexible workflows give growing businesses room to focus.'],['GROWTH','People power progress.','The right support team creates capacity for growth.']].map(x=>`<article class="insight"><div class="eyebrow">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></div></section><section class="section" id="talent"><div class="container"><div class="section-head"><div><div class="eyebrow">THE PEOPLE BEHIND THE WORK</div><h2>Global Talent. Human Expertise.</h2></div><p class="section-intro">Meet the people shaping Loyola Global Works and building a dependable partner for growing businesses.</p></div><div class="team">${db.team.map(p=>`<article class="person"><div class="person-photo">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:''}</div><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p><div class="bio">${esc(p.bio)}</div></article>`).join('')}</div></div></section><section class="section" id="careers"><div class="container"><div class="section-head"><div><div class="eyebrow">CAREERS</div><h2>Do Work That Matters.</h2></div><p class="section-intro">Explore open roles and find your next opportunity with Loyola Global Works.</p></div><div class="jobs">${db.jobs.map(j=>`<article class="job"><div><h3>${esc(j.title)}</h3><div class="tag">${esc(j.type)}</div></div><p>${esc(j.summary)}</p><a class="cta apply" href="/careers/${j.id}">VIEW POSITION →</a></article>`).join('')}</div></div></section><section class="section" id="insights"><div class="container"><div class="section-head"><div><div class="eyebrow">INSIGHTS</div><h2>Thoughtful Support.<br>Better Business.</h2></div><p class="section-intro">Ideas on talent, operations, remote work, and building stronger businesses.</p></div><div class="insights">${[['TALENT','The New Global Workforce.','Why the best teams are increasingly built across borders.'],['OPERATIONS','Systems That Scale.','The operational habits that create reliable growth.'],['GROWTH','People power progress.','The right support team creates capacity for growth.']].map(x=>`<article class="insight"><div class="eyebrow">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></div></section><section class="section" id="contact"><div class="container contact"><div><div class="eyebrow">LET'S WORK TOGETHER</div><h2>Build Your Next Chapter.</h2><p class="section-intro">Tell us what your business needs. We'll start with a conversation and build from there.</p></div><form class="contact-form" onsubmit="event.preventDefault();alert('Thank you. Your message has been received.')"><div class="field"><label>Name</label><input required></div><div class="field"><label>Work Email</label><input type="email" required></div><div class="field"><label>Company</label><input></div><div class="field"><label>How can we help?</label><textarea required></textarea></div><button class="cta">SEND INQUIRY →</button></form></div></section></main>${footer()}`}function footer(){return `<footer class="footer"><div class="container"><div class="footer-top"><div>${logo(true)}<p>Connecting exceptional global talent with businesses that are ready to grow.</p></div><div><div class="eyebrow">CONTACT</div><p>${esc(db.settings.email)}<br>${esc(db.settings.phone)}<br>${esc(db.settings.address)}</p></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} Loyola Global Works</span><span>CONNECTING TALENT. POWERING BUSINESS.</span></div></div></footer>`}function jobPage(id){const j=db.jobs.find(x=>x.id===id);if(!j){document.body.innerHTML='<section class="section"><div class="container"><h1 class="serif">Position not found.</h1></div></section>';return}document.body.innerHTML=`${header()}<section class="jobhero"><div class="container"><div class="eyebrow">CAREERS · ${esc(j.location)}</div><h1>${esc(j.title)}</h1><div class="jobmeta">${esc(j.type)} · ${esc(j.location)}</div></div></section><section class="section"><div class="container applywrap"><div><div class="eyebrow">THE ROLE</div><h2 class="serif">Make an impact with Loyola Global Works.</h2><p class="section-intro">${esc(j.summary)}</p><div class="notice">We look for people who communicate clearly, take ownership, learn quickly, and care about excellent work.</div></div><div><div class="eyebrow">APPLY NOW</div><form class="contact-form" onsubmit="submitJob(event,'${j.id}')">${j.fields.map((f,i)=>`<div class="field"><label>${esc(f[0])}${f[2]?' *':''}</label>${f[1]==='textarea'?`<textarea name="f${i}" ${f[2]?'required':''}></textarea>`:`<input type="${esc(f[1])}" name="f${i}" ${f[2]?'required':''}>`}</div>`).join('')}<div class="notice">Your information will be reviewed for recruitment purposes.</div><button class="cta">SUBMIT APPLICATION →</button></form></div></div></section>${footer()}`}function submitJob(e,id){e.preventDefault();const j=db.jobs.find(x=>x.id===id),fd=new FormData(e.target),a=JSON.parse(localStorage.getItem('lgw-applications')||'[]'),o={job:id,submitted:new Date().toISOString(),answers:{}};j.fields.forEach((f,i)=>o.answers[f[0]]=fd.get('f'+i));a.push(o);localStorage.setItem('lgw-applications',JSON.stringify(a));e.target.innerHTML='<div class="notice"><b>Application received.</b><br>Thank you for your interest in Loyola Global Works.</div>'}function login(){document.body.innerHTML=`<div class="login"><div class="loginbox">${logo()}<h1>Admin Access</h1><div class="field"><label>Password</label><input id="adminpw" type="password"></div><button class="cta" style="margin-top:15px;width:100%" onclick="if(adminpw.value==='LGWadmin'){sessionStorage.setItem('lgw-auth','1');location.href='/admin'}else alert('Incorrect password')">ENTER ADMIN</button><p style="font-size:10px;color:#777">Demo password: LGWadmin. Replace with real authentication before production.</p></div></div>`}function admin(){if(sessionStorage.getItem('lgw-auth')!=='1')return login();document.body.innerHTML=`<div class="admin"><div class="adminbar"><a href="/">${logo(true)}</a><div><a href="/" style="margin-right:20px;font-size:10px;letter-spacing:.1em">VIEW SITE</a><button class="smallbtn" onclick="sessionStorage.removeItem('lgw-auth');location.href='/admin'">SIGN OUT</button></div></div><div class="admin-layout"><aside class="sidebar"><button class="sidebtn active" onclick="tab('dashboard',this)">Dashboard</button><button class="sidebtn" onclick="tab('brand',this)">Brand Assets</button><button class="sidebtn" onclick="tab('homepage',this)">Homepage / Hero</button><button class="sidebtn" onclick="tab('team',this)">Leadership</button><button class="sidebtn" onclick="tab('jobs',this)">Open Positions</button><button class="sidebtn" onclick="tab('applications',this)">Applications</button></aside><main class="adminmain"><div id="admincontent"></div></main></div></div>`;tab('dashboard',document.querySelector('.sidebtn'))}function tab(name,btn){document.querySelectorAll('.sidebtn').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');const c=document.getElementById('admincontent');if(name==='dashboard')c.innerHTML=dashboard();if(name==='brand')c.innerHTML=brandEditor();if(name==='homepage')c.innerHTML=homepageEditor();if(name==='team')c.innerHTML=teamEditor();if(name==='jobs')c.innerHTML=jobsEditor();if(name==='applications')c.innerHTML=appsEditor()}function dashboard(){return `<div class="admin-title"><div><div class="eyebrow">CONTENT MANAGEMENT</div><h1>Loyola Global Works</h1></div><button class="smallbtn" onclick="publish()">PUBLISH CHANGES</button></div><div class="grid2"><div class="panel"><div class="eyebrow">LEADERSHIP</div><h2>${db.team.length} people</h2><p class="section-intro">CEO, Operations Lead, Talent Director, Client Success and future leadership roles.</p></div><div class="panel"><div class="eyebrow">CAREERS</div><h2>${db.jobs.length} openings</h2><p class="section-intro">Add unlimited positions and give every role its own application landing page.</p></div></div><div class="panel"><div class="eyebrow">PUBLISH STATUS</div><h2>Ready to publish.</h2><p class="section-intro">Edits are saved in this browser in this starter CMS. A hosted database/storage connection is required for global multi-device publishing.</p><div id="pubstatus" class="status ok">● LOCAL CONTENT SAVED</div></div>`}function brandEditor(){return `<div class="admin-title"><div><div class="eyebrow">BRAND SYSTEM</div><h1>Logo Management</h1></div><button class="smallbtn" onclick="saveBrand()">SAVE & PUBLISH</button></div><div class="panel"><h2>Primary Horizontal Logo</h2><p class="section-intro">Main LGW logo used across the website.</p><div class="upload">${db.settings.logoPrimary?`<img src="${db.settings.logoPrimary}" style="max-width:360px;max-height:150px;display:block;margin:0 auto 15px;object-fit:contain;background:#111;padding:18px">`:''}<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="uploadLogo(this,'logoPrimary')"><p>Recommended: transparent PNG or SVG, under 4 MB.</p></div></div><div class="grid2"><div class="panel"><h2>LGW Monogram</h2><div class="upload">${db.settings.logoMonogram?`<img src="${db.settings.logoMonogram}" style="max-width:220px;max-height:180px;display:block;margin:0 auto 15px;object-fit:contain;background:#111;padding:18px">`:''}<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="uploadLogo(this,'logoMonogram')"></div></div><div class="panel"><h2>White / Dark Logo</h2><div class="upload">${db.settings.logoWhite?`<img src="${db.settings.logoWhite}" style="max-width:360px;max-height:150px;display:block;margin:0 auto 15px;object-fit:contain;background:#111;padding:18px">`:''}<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="uploadLogo(this,'logoWhite')"></div></div></div><div class="panel"><h2>Logo Rules</h2><p class="section-intro">Uploaded assets are used directly. No gradients, shadows, stretching, rotation or separate globe icon are added.</p></div>`}function uploadLogo(input,key){const f=input.files[0];if(!f)return;if(f.size>4*1024*1024){alert('Please use an image under 4 MB.');input.value='';return}const r=new FileReader();r.onload=()=>{db.settings[key]=r.result;save(db);tab('brand',document.querySelectorAll('.sidebtn')[1])};r.readAsDataURL(f)}function saveBrand(){save(db);alert('Brand assets saved in this browser.')}function homepageEditor(){const st=db.settings;return `<div class="admin-title"><div><div class="eyebrow">HOMEPAGE</div><h1>Hero Builder</h1></div><button class="smallbtn" onclick="saveHomepage()">SAVE HERO</button></div><div class="panel"><h2>Full Hero Background</h2><p class="section-intro">Upload a photo or artwork that fills the entire hero. The LGW logo, headline, copy and buttons remain separate editable elements.</p><div class="upload">${st.heroImage?`<img src="${st.heroImage}" style="width:100%;max-height:330px;object-fit:cover;display:block;margin-bottom:16px">`:''}<input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadHero(this)"><p>Recommended: high-resolution landscape image, ideally 1920px wide or larger.</p>${st.heroImage?`<button class="smallbtn alt" onclick="db.settings.heroImage='';save(db);tab('homepage',document.querySelectorAll('.sidebtn')[2])">REMOVE BACKGROUND</button>`:''}</div></div><div class="grid2"><div class="panel"><h2>Background Controls</h2><div class="field"><label>Overlay Darkness — <span id="overlayValue">${Number(st.heroOverlay??55)}%</span></label><input id="heroOverlay" type="range" min="0" max="90" value="${Number(st.heroOverlay??55)}" oninput="overlayValue.textContent=this.value+'%'"/></div><div class="field" style="margin-top:14px"><label>Background Position</label><select id="heroPosition"><option ${st.heroPosition==='center center'?'selected':''}>center center</option><option ${st.heroPosition==='center top'?'selected':''}>center top</option><option ${st.heroPosition==='center bottom'?'selected':''}>center bottom</option><option ${st.heroPosition==='left center'?'selected':''}>left center</option><option ${st.heroPosition==='right center'?'selected':''}>right center</option></select></div><div class="field" style="margin-top:14px"><label>Background Size</label><select id="heroSize"><option ${st.heroSize==='cover'?'selected':''}>cover</option><option ${st.heroSize==='contain'?'selected':''}>contain</option><option ${st.heroSize==='auto'?'selected':''}>auto</option></select></div><div class="field" style="margin-top:14px"><label>Hero Height (px)</label><input id="heroHeight" type="number" min="520" max="1100" value="${Number(st.heroHeight??760)}"></div></div><div class="panel"><h2>Hero Logo</h2><div class="field"><label>Logo Width (px)</label><input id="heroLogoSize" type="number" min="180" max="720" value="${Number(st.heroLogoSize??520)}"></div><div class="field" style="margin-top:14px"><label>Show LGW Logo</label><select id="heroLogoShow"><option value="true" ${st.heroLogoShow!==false?'selected':''}>Show</option><option value="false" ${st.heroLogoShow===false?'selected':''}>Hide</option></select></div><div style="margin-top:18px;background:#111;padding:20px;text-align:center"><img src="${st.logoWhite||st.logoMonogram||st.logoPrimary}" style="max-width:75%;max-height:130px;object-fit:contain"></div><p class="section-intro" style="margin-top:12px">Change the actual LGW asset from Brand Assets.</p></div></div><div class="panel"><h2>Hero Content</h2><div class="field"><label>Eyebrow</label><input id="heroKicker" value="${esc(st.heroKicker||'GLOBAL TALENT. REAL IMPACT.')}"></div><div class="field" style="margin-top:14px"><label>Headline</label><textarea id="heroTitle">${esc(st.heroTitle)}</textarea></div><div class="field" style="margin-top:14px"><label>Supporting Text</label><textarea id="heroText">${esc(st.heroText)}</textarea></div><div class="grid2" style="margin-top:14px"><div class="field"><label>Primary Button</label><input id="heroPrimary" value="${esc(st.heroPrimary||'EXPLORE OUR SERVICES')}"></div><div class="field"><label>Secondary Button</label><input id="heroSecondary" value="${esc(st.heroSecondary||'MEET OUR TEAM')}"></div></div></div><div class="panel"><h2>Contact Details</h2><div class="grid2"><div class="field"><label>Email</label><input id="email" value="${esc(st.email)}"></div><div class="field"><label>Phone</label><input id="phone" value="${esc(st.phone)}"></div></div><div class="field" style="margin-top:14px"><label>Address</label><input id="address" value="${esc(st.address)}"></div></div>`}function saveHomepage(){const st=db.settings;Object.assign(st,{heroTitle:document.getElementById('heroTitle').value,heroText:document.getElementById('heroText').value,heroKicker:document.getElementById('heroKicker').value,heroPrimary:document.getElementById('heroPrimary').value,heroSecondary:document.getElementById('heroSecondary').value,heroOverlay:Number(document.getElementById('heroOverlay').value),heroPosition:document.getElementById('heroPosition').value,heroSize:document.getElementById('heroSize').value,heroHeight:Number(document.getElementById('heroHeight').value),heroLogoSize:Number(document.getElementById('heroLogoSize').value),heroLogoShow:document.getElementById('heroLogoShow').value==='true',email:document.getElementById('email').value,phone:document.getElementById('phone').value,address:document.getElementById('address').value});save(db);alert('Hero settings saved in this browser. Click PUBLISH CHANGES from Dashboard when ready.');location.href='/' }function uploadHero(input){const f=input.files[0];if(!f)return;if(f.size>4*1024*1024){alert('Please use an image under 4 MB.');input.value='';return}const r=new FileReader();r.onload=()=>{db.settings.heroImage=r.result;save(db);tab('homepage',document.querySelectorAll('.sidebtn')[2])};r.readAsDataURL(f)}function teamEditor(){return `<div class="admin-title"><div><div class="eyebrow">PEOPLE</div><h1>Leadership</h1></div><button class="smallbtn" onclick="addPerson()">+ ADD PERSON</button></div><div class="rows">${db.team.map((p,i)=>`<div class="panel"><div class="grid2"><div><div class="field"><label>Name</label><input value="${esc(p.name)}" onchange="db.team[${i}].name=this.value;save(db)"></div><div class="field" style="margin-top:12px"><label>Role</label><input value="${esc(p.role)}" onchange="db.team[${i}].role=this.value;save(db)"></div><div class="field" style="margin-top:12px"><label>Bio</label><textarea onchange="db.team[${i}].bio=this.value;save(db)">${esc(p.bio)}</textarea></div></div><div><div class="upload">${p.image?`<img src="${p.image}" style="width:100%;aspect-ratio:1;object-fit:cover;margin-bottom:10px">`:''}<input type="file" accept="image/*" onchange="uploadPerson(this,${i})"></div><button class="smallbtn alt" style="margin-top:12px" onclick="removePerson(${i})">REMOVE</button></div></div></div>`).join('')}</div>`}function uploadPerson(input,i){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{db.team[i].image=r.result;save(db);tab('team',document.querySelectorAll('.sidebtn')[3])};r.readAsDataURL(f)}function addPerson(){db.team.push({name:'New Team Member',role:'New Role',bio:'Add a short professional introduction.',image:''});save(db);tab('team',document.querySelectorAll('.sidebtn')[3])}function removePerson(i){db.team.splice(i,1);save(db);tab('team',document.querySelectorAll('.sidebtn')[3])}function jobsEditor(){return `<div class="admin-title"><div><div class="eyebrow">CAREERS</div><h1>Open Positions</h1></div><button class="smallbtn" onclick="addJob()">+ ADD POSITION</button></div><div class="rows">${db.jobs.map((j,i)=>`<div class="panel"><div class="grid2"><div><div class="field"><label>Position title</label><input value="${esc(j.title)}" onchange="db.jobs[${i}].title=this.value;save(db)"></div><div class="field" style="margin-top:12px"><label>Type</label><input value="${esc(j.type)}" onchange="db.jobs[${i}].type=this.value;save(db)"></div><div class="field" style="margin-top:12px"><label>Location</label><input value="${esc(j.location)}" onchange="db.jobs[${i}].location=this.value;save(db)"></div><div class="field" style="margin-top:12px"><label>Summary</label><textarea onchange="db.jobs[${i}].summary=this.value;save(db)">${esc(j.summary)}</textarea></div></div><div><div class="eyebrow">APPLICATION FIELDS</div><div class="rows">${j.fields.map((f,k)=>`<div class="row"><input value="${esc(f[0])}" onchange="db.jobs[${i}].fields[${k}][0]=this.value;save(db)"><select onchange="db.jobs[${i}].fields[${k}][1]=this.value;save(db)"><option ${f[1]==='text'?'selected':''}>text</option><option ${f[1]==='email'?'selected':''}>email</option><option ${f[1]==='tel'?'selected':''}>tel</option><option ${f[1]==='url'?'selected':''}>url</option><option ${f[1]==='textarea'?'selected':''}>textarea</option></select><button class="smallbtn alt" onclick="removeField(${i},${k})">×</button></div>`).join('')}</div><button class="smallbtn alt" style="margin-top:10px" onclick="addField(${i})">+ ADD FIELD</button><div style="margin-top:25px"><a class="smallbtn" href="/careers/${j.id}" target="_blank">OPEN LANDING PAGE</a> <button class="smallbtn alt" onclick="removeJob(${i})">REMOVE POSITION</button></div></div></div></div>`).join('')}</div>`}function addJob(){db.jobs.push({id:Date.now().toString(),title:'New Position',type:'Remote · Full-time',location:'Global',summary:'Add the position summary here.',fields:[['Full Name','text',true],['Email Address','email',true],['Resume URL','url',false],['Tell us about yourself','textarea',true]]});save(db);tab('jobs',document.querySelectorAll('.sidebtn')[4])}function removeJob(i){db.jobs.splice(i,1);save(db);tab('jobs',document.querySelectorAll('.sidebtn')[4])}function addField(i){db.jobs[i].fields.push(['New question','text',false]);save(db);tab('jobs',document.querySelectorAll('.sidebtn')[4])}function removeField(i,k){db.jobs[i].fields.splice(k,1);save(db);tab('jobs',document.querySelectorAll('.sidebtn')[4])}function appsEditor(){const a=JSON.parse(localStorage.getItem('lgw-applications')||'[]');return `<div class="admin-title"><div><div class="eyebrow">RECRUITING</div><h1>Applications</h1></div><button class="smallbtn alt" onclick="localStorage.removeItem('lgw-applications');tab('applications',document.querySelectorAll('.sidebtn')[5])">CLEAR</button></div><div class="panel">${a.length?`<div class="rows">${a.map(x=>`<div style="border-bottom:1px solid #ddd;padding:15px 0"><strong>${esc(db.jobs.find(j=>j.id===x.job)?.title||'Position')}</strong><div style="font-size:10px;color:#777;margin:5px 0">${new Date(x.submitted).toLocaleString()}</div>${Object.entries(x.answers).map(([k,v])=>`<div style="font-size:12px;margin:5px 0"><b>${esc(k)}:</b> ${esc(v)}</div>`).join('')}</div>`).join('')}</div>`:'<p class="section-intro">No applications yet.</p>'}</div>`}function publish(){save(db);const s=document.getElementById('pubstatus');if(s){s.textContent='● SAVED IN THIS BROWSER';s.className='status ok'}else alert('Changes saved in this browser. A hosted database/storage connection is required for global publishing.')}const path=location.pathname;if(path==='/admin'||path==='/admin/')admin();else if(path.startsWith('/careers/'))jobPage(path.split('/')[2]);else document.body.innerHTML=home();</script></body></html>
