<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loyola Global Works — Connecting Talent. Powering Business.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#111111;
  --white:#ffffff;
  --graphite:#292929;
  --slate:#555555;
  --silver:#a6a6a6;
  --platinum:#d9d9d9;
  --display: 'Cormorant Garamond', serif;
  --corp: 'Montserrat', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--corp);
  color:var(--obsidian);
  background:var(--white);
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--corp);cursor:pointer;}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
@media(max-width:640px){.wrap{padding:0 20px;}}

/* ---------- eyebrow / small text ---------- */
.eyebrow{
  font-family:var(--corp);font-weight:600;font-size:12px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--slate);
}
.eyebrow.light{color:var(--platinum);}

/* ---------- NAV ---------- */
.site-nav{
  position:sticky;top:0;z-index:500;background:rgba(255,255,255,0.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--platinum);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:78px;}
.nav-logo{display:flex;align-items:center;gap:12px;}
.nav-logo img{height:34px;width:auto;}
.nav-logo .nm{font-family:var(--corp);font-weight:700;font-size:14px;letter-spacing:1.5px;}
.nav-logo .nm span{display:block;font-weight:500;font-size:8.5px;letter-spacing:1.8px;color:var(--slate);margin-top:2px;}
.nav-links{display:flex;align-items:center;gap:36px;}
.nav-links a{font-size:12.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--obsidian);padding-bottom:4px;border-bottom:2px solid transparent;transition:border-color .2s;}
.nav-links a:hover,.nav-links a.active{border-color:var(--obsidian);}
.nav-cta{background:var(--obsidian);color:var(--white);padding:12px 22px;font-size:11.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;white-space:nowrap;}
.nav-cta:hover{background:var(--graphite);}
.nav-burger{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:8px;}
.nav-burger span{width:22px;height:2px;background:var(--obsidian);}
.mobile-menu{display:none;flex-direction:column;gap:0;border-top:1px solid var(--platinum);background:var(--white);}
.mobile-menu.open{display:flex;}
.mobile-menu a{padding:16px 32px;font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;border-bottom:1px solid var(--platinum);}
@media(max-width:900px){
  .nav-links{display:none;}
  .nav-cta{display:none;}
  .nav-burger{display:flex;}
}

/* ---------- HERO ---------- */
.hero{background:var(--obsidian);color:var(--white);position:relative;overflow:hidden;}
.hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;align-items:center;min-height:640px;gap:40px;}
.hero-copy{padding:100px 0 90px;position:relative;z-index:2;}
.hero-copy .eyebrow{margin-bottom:22px;}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(40px,5.4vw,68px);line-height:1.06;letter-spacing:.2px;}
.hero p.sub{font-family:var(--corp);font-weight:400;color:var(--platinum);font-size:17px;max-width:480px;margin:26px 0 36px;line-height:1.7;}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;font-size:12px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;border:1px solid transparent;transition:all .2s;}
.btn-solid-light{background:var(--white);color:var(--obsidian);}
.btn-solid-light:hover{background:var(--platinum);}
.btn-outline-light{border-color:rgba(255,255,255,0.4);color:var(--white);}
.btn-outline-light:hover{border-color:var(--white);}
.btn-solid-dark{background:var(--obsidian);color:var(--white);}
.btn-solid-dark:hover{background:var(--graphite);}
.btn-outline-dark{border-color:var(--obsidian);color:var(--obsidian);}
.btn-outline-dark:hover{background:var(--obsidian);color:var(--white);}
.hero-visual{position:relative;height:100%;min-height:520px;}
.hero-visual img{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:min(720px,58vw);max-width:none;}
@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr;min-height:auto;}
  .hero-copy{padding:64px 0 40px;text-align:left;}
  .hero-visual{min-height:280px;order:-1;}
  .hero-visual img{position:relative;right:auto;top:auto;transform:none;width:100%;margin:0 auto;}
}

/* ---------- SECTIONS ---------- */
section{padding:110px 0;}
@media(max-width:640px){section{padding:70px 0;}}
.section-head{max-width:640px;margin-bottom:60px;}
.section-head .eyebrow{margin-bottom:18px;}
.section-head h2{font-family:var(--display);font-weight:600;font-size:clamp(32px,4vw,46px);line-height:1.12;}
.section-dark{background:var(--obsidian);color:var(--white);}
.section-dark .eyebrow{color:var(--platinum);}
.section-graphite{background:var(--graphite);color:var(--white);}
.divider{height:1px;background:var(--platinum);border:none;}

/* ---------- SERVICES ---------- */
.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--platinum);border:1px solid var(--platinum);}
.service-card{background:var(--white);padding:42px 34px;transition:background .2s;}
.service-card:hover{background:#fafafa;}
.service-num{font-family:var(--display);font-size:15px;color:var(--silver);font-weight:600;margin-bottom:22px;}
.service-card h3{font-family:var(--corp);font-weight:600;font-size:20px;margin-bottom:12px;letter-spacing:.2px;}
.service-card p{color:var(--slate);font-size:14.5px;line-height:1.7;}
@media(max-width:900px){.service-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.service-grid{grid-template-columns:1fr;}}

/* ---------- STATS ---------- */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;padding-top:70px;border-top:1px solid rgba(255,255,255,.15);margin-top:70px;}
.stat-row .num{font-family:var(--display);font-weight:600;font-size:44px;}
.stat-row .lbl{margin-top:8px;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--platinum);}
@media(max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr);row-gap:36px;}}

/* ---------- LEADERSHIP ---------- */
.leader-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;}
.leader-card{}
.leader-photo{width:100%;aspect-ratio:1/1;background:var(--platinum) center/cover no-repeat;margin-bottom:20px;position:relative;overflow:hidden;}
.leader-photo .ph-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:52px;color:var(--silver);background:linear-gradient(135deg,#eee,var(--platinum));}
.leader-card h3{font-weight:600;font-size:17px;letter-spacing:.2px;}
.leader-card .role{font-size:12px;color:var(--slate);letter-spacing:1px;text-transform:uppercase;margin-top:5px;font-weight:600;}
.leader-card .bio{font-size:13.5px;color:var(--slate);margin-top:12px;line-height:1.65;}
@media(max-width:900px){.leader-grid{grid-template-columns:repeat(2,1fr);}}

/* ---------- CAREERS ---------- */
.job-list{display:flex;flex-direction:column;border-top:1px solid var(--platinum);}
.job-row{display:flex;align-items:center;justify-content:space-between;padding:30px 6px;border-bottom:1px solid var(--platinum);transition:background .2s;gap:20px;flex-wrap:wrap;}
.job-row:hover{background:#fafafa;}
.job-title{font-family:var(--display);font-weight:600;font-size:24px;}
.job-meta{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--slate);border:1px solid var(--platinum);padding:5px 12px;}
.job-arrow{font-size:13px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--obsidian);padding-bottom:3px;}
.empty-state{padding:60px 0;color:var(--slate);font-size:14.5px;border-top:1px solid var(--platinum);}

/* ---------- FOOTER ---------- */
footer{background:var(--obsidian);color:var(--platinum);padding:80px 0 34px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:50px;}
.footer-brand img{height:30px;margin-bottom:18px;}
.footer-brand .tag{border:none;padding:0;font-size:12px;letter-spacing:1px;color:var(--silver);text-transform:uppercase;}
.footer-col h4{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--white);margin-bottom:18px;font-weight:600;}
.footer-col a{display:block;font-size:14px;color:var(--platinum);margin-bottom:12px;}
.footer-col a:hover{color:var(--white);}
.footer-bottom{margin-top:70px;padding-top:26px;border-top:1px solid var(--graphite);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--silver);}
@media(max-width:800px){.footer-grid{grid-template-columns:1fr 1fr;}}

/* ---------- PAGE HERO (secondary pages) ---------- */
.page-hero{background:var(--obsidian);color:var(--white);padding:150px 0 80px;}
.page-hero h1{font-family:var(--display);font-weight:600;font-size:clamp(36px,5vw,58px);}
.page-hero p{color:var(--platinum);max-width:560px;margin-top:20px;font-size:16px;}
.breadcrumb{font-size:12px;color:var(--silver);letter-spacing:1px;text-transform:uppercase;margin-bottom:20px;}
.breadcrumb a{color:var(--silver);}
.breadcrumb a:hover{color:var(--white);}

/* ---------- ABOUT ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;}
.about-grid h2{font-family:var(--display);font-weight:600;font-size:clamp(30px,3.6vw,42px);line-height:1.15;}
.about-grid p{color:var(--slate);margin-top:22px;font-size:15.5px;line-height:1.8;}
.pillar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--platinum);border:1px solid var(--platinum);margin-top:70px;}
.pillar{background:var(--white);padding:36px 28px;text-align:center;}
.pillar .pw{font-family:var(--display);font-weight:600;font-size:26px;}
.pillar .pm{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--slate);margin-top:8px;}
@media(max-width:900px){.about-grid{grid-template-columns:1fr;}.pillar-grid{grid-template-columns:repeat(2,1fr);}}

/* ---------- FORMS ---------- */
.field{margin-bottom:22px;}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--slate);margin-bottom:9px;}
.field input,.field textarea,.field select{
  width:100%;padding:14px 16px;border:1px solid var(--platinum);font-family:var(--corp);font-size:14.5px;background:var(--white);color:var(--obsidian);
}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--obsidian);}
.field textarea{resize:vertical;min-height:120px;}
.field-req{color:#b23b3b;}
.form-card{max-width:640px;border:1px solid var(--platinum);padding:44px;}
@media(max-width:640px){.form-card{padding:28px;}}
.success-box{border:1px solid var(--platinum);padding:50px 40px;text-align:center;max-width:560px;}
.success-box .ic{font-family:var(--display);font-size:44px;margin-bottom:16px;}

/* ---------- ADMIN ---------- */
.admin-shell{min-height:100vh;background:#f5f5f5;}
.admin-topbar{background:var(--obsidian);color:var(--white);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;}
.admin-topbar .at-left{display:flex;align-items:center;gap:14px;}
.admin-topbar img{height:24px;}
.admin-topbar .at-title{font-size:13px;font-weight:600;letter-spacing:.8px;}
.admin-topbar .at-right{display:flex;gap:10px;align-items:center;}
.admin-body{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px);}
.admin-sidebar{background:var(--white);border-right:1px solid var(--platinum);padding:22px 0;}
.admin-sidebar button{display:block;width:100%;text-align:left;background:none;border:none;padding:14px 26px;font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--slate);border-left:3px solid transparent;}
.admin-sidebar button.active{color:var(--obsidian);border-left-color:var(--obsidian);background:#fafafa;}
.admin-sidebar button:hover{color:var(--obsidian);}
.admin-main{padding:40px 44px;max-width:1000px;}
.admin-main h2{font-family:var(--display);font-weight:600;font-size:30px;margin-bottom:6px;}
.admin-sub{color:var(--slate);font-size:14px;margin-bottom:34px;}
.admin-card{background:var(--white);border:1px solid var(--platinum);padding:30px;margin-bottom:22px;}
.admin-card h3{font-size:15px;font-weight:600;margin-bottom:18px;letter-spacing:.3px;}
.admin-grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.admin-grid2{grid-template-columns:1fr;}.admin-body{grid-template-columns:1fr;}.admin-sidebar{display:flex;overflow-x:auto;padding:10px;border-right:none;border-bottom:1px solid var(--platinum);}.admin-sidebar button{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:10px 16px;}.admin-sidebar button.active{border-bottom-color:var(--obsidian);}}
.btn-admin{background:var(--obsidian);color:var(--white);padding:12px 22px;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:none;}
.btn-admin:hover{background:var(--graphite);}
.btn-admin.danger{background:#7a2b2b;}
.btn-admin.danger:hover{background:#8f3535;}
.btn-admin.ghost{background:none;border:1px solid var(--platinum);color:var(--obsidian);}
.btn-admin.ghost:hover{border-color:var(--obsidian);}
.btn-admin.sm{padding:9px 16px;font-size:11px;}
.upload-box{border:1.5px dashed var(--platinum);padding:26px;text-align:center;font-size:13px;color:var(--slate);cursor:pointer;position:relative;}
.upload-box:hover{border-color:var(--obsidian);}
.upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-preview{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.upload-preview .pv-frame{background:var(--graphite);padding:14px 18px;display:flex;align-items:center;justify-content:center;min-width:120px;}
.upload-preview .pv-frame.light{background:#f0f0f0;}
.upload-preview img{max-height:44px;max-width:160px;}
.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.admin-table th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--slate);padding:10px 12px;border-bottom:1px solid var(--platinum);}
.admin-table td{padding:12px;border-bottom:1px solid var(--platinum);vertical-align:top;}
.pill-actions{display:flex;gap:8px;}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--obsidian);}
.login-card{background:var(--white);padding:56px 46px;width:380px;text-align:center;}
.login-card img{height:40px;margin:0 auto 26px;}
.login-card h2{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:8px;}
.login-card p{color:var(--slate);font-size:13.5px;margin-bottom:26px;}
.login-err{color:#b23b3b;font-size:12.5px;margin-top:12px;}
.field-inline{display:flex;gap:10px;}
.tiny-note{font-size:11.5px;color:var(--silver);margin-top:10px;line-height:1.6;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.chip{border:1px solid var(--platinum);padding:6px 12px;font-size:11.5px;display:flex;align-items:center;gap:8px;}
.chip button{background:none;border:none;color:var(--slate);font-size:13px;line-height:1;padding:0;}
.toast{position:fixed;bottom:26px;right:26px;background:var(--obsidian);color:var(--white);padding:14px 22px;font-size:13px;z-index:2000;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--white);color:var(--slate);font-size:13px;letter-spacing:1px;text-transform:uppercase;}
</style>
</head>

<div id="toast" class="toast"></div>
<div id="app"><div class="loading-screen">Loading Loyola Global Works…</div></div>

function storageGet(key){
  if(!HAS_STORAGE) return Promise.resolve(null);
  var url = SUPABASE_URL + "/rest/v1/" + SUPABASE_TABLE + "?key=eq." + encodeURIComponent(key) + "&select=value";

========================================================= */
function parseHash(){
  var h = location.hash.replace(/^#/, "");
  if(h === "" ) h = "/";
  var parts = h.split("/").filter(Boolean);
  return parts;
}

function go(hash){ location.hash = hash; }

/* =========================================================
   SMALL HELPERS
========================================================= */
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if(k === "html"){ e.innerHTML = attrs[k]; }
    else if(k === "class"){ e.className = attrs[k]; }
    else if(k.indexOf("on") === 0 && typeof attrs[k] === "function"){ e.addEventListener(k.slice(2), attrs[k]); }
    else { e.setAttribute(k, attrs[k]); }
  });
  (children||[]).forEach(function(c){
    if(c === null || c === undefined) return;
    if(typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function esc(s){
  var d = document.createElement("div"); d.textContent = (s===undefined||s===null) ? "" : s; return d.innerHTML;
}
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function fileToDataURL(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(){ reject(new Error("read failed")); };
    r.readAsDataURL(file);
  });
}

function renderApplyForm(job, container){
  if(!container) return;
  container.innerHTML = "";
  var card = el("div", {class:"form-card"});
  job.fields.forEach(function(f){
    var field = el("div", {class:"field"});
    field.appendChild(el("label", {}, [f.label, f.required ? el("span",{class:"field-req"},[" *"]) : null]));
    var input;
    if(f.type === "textarea"){ input = el("textarea", {rows:5}); }
    else if(f.type === "email"){ input = el("input", {type:"email"}); }
    else { input = el("input", {type:"text"}); }
    if(f.required) input.setAttribute("required","required");
    input.setAttribute("data-field-id", f.id);
    field.appendChild(input);
    card.appendChild(field);
  });
  var btn = el("button", {class:"btn btn-solid-dark", style:"border:none;"}, ["Submit Application"]);
  card.appendChild(btn);
  container.appendChild(card);

  btn.addEventListener("click", function(){
    var answers = {};
    var missing = false;
    job.fields.forEach(function(f){
      var inp = card.querySelector("[data-field-id='"+f.id+"']");
      var v = inp ? inp.value.trim() : "";
      if(f.required && !v) missing = true;
      answers[f.id] = { label: f.label, value: v };
    });
    if(missing){ showToast("Please fill in all required fields."); return; }
    var submission = { id: uid(), submittedAt: new Date().toISOString(), answers: answers };

    btn.disabled = true;
    btn.textContent = "Submitting…";

    // Pull the latest applications record from storage first (instead of
    // trusting this browser's possibly-stale local copy), then merge this
    // submission in and save. This prevents two people applying around the
    // same time from overwriting each other's application.
    storageGet(KEYS.applications).then(function(raw){
      var latest = DB.applications;
      if(raw){
        try{ latest = JSON.parse(raw); }catch(e){}
      }
      if(!latest[job.id]) latest[job.id] = [];
      latest[job.id].push(submission);
      DB.applications = latest;
      return storageSet(KEYS.applications, DB.applications);
    }).then(function(){
      // Fire off an automatic email notification to the company inbox.
      notifyCompanyOfApplication(job, submission);

      container.innerHTML = "";
      container.appendChild(el("div", {class:"success-box"}, [
        el("div", {class:"ic"}, ["✓"]),
        el("h2", {style:"font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:10px;"}, ["Application Received"]),
        el("p", {style:"color:var(--slate);font-size:14.5px;margin-bottom:24px;"}, ["Thank you for applying to " + job.title + ". Our talent team will review your application and reach out if there's a match."]),
        el("a", {href:"#/careers", class:"btn btn-outline-dark"}, ["← Back to Careers"])
      ]));
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = "Submit Application";
      showToast("Could not submit — check connection and try again.");
    });
  });

  // Sends a notification email to the company's configured contact address
  // using FormSubmit's AJAX endpoint (no backend/server needed). The very
  // first time an email is sent to a given address, FormSubmit requires a
  // one-time click on a confirmation email it sends to that address —
  // after that, all future submissions deliver automatically.
  function notifyCompanyOfApplication(job, submission){
    var to = DB.settings.companyEmail;
    if(!to) return;
    var payload = {
      _subject: "New Application — " + job.title,
      "Position": job.title,
      "Department": job.department,
      "Submitted": new Date(submission.submittedAt).toLocaleString()
    };
    job.fields.forEach(function(f){
      var a = submission.answers[f.id];
      payload[f.label] = a ? a.value : "";
    });
    fetch("https://formsubmit.co/ajax/" + encodeURIComponent(to), {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    }).catch(function(){ /* Non-fatal: the application is already saved either way. */ });
  }
}

    var lead = {
      id: uid(),
      submittedAt: new Date().toISOString(),
      name: name,
      company: companyInput.value.trim(),
      email: email,
      phone: phone,
      service: service,
      preferredDate: dateInput.value,
      preferredTime: timeInput.value,
      message: messageInput.value.trim()
    };

    btn.disabled = true;
    btn.textContent = "Submitting…";

    // Pull the latest leads record from storage first (instead of trusting
    // this browser's possibly-stale local copy), then merge this lead in
    // and save. This prevents two people submitting around the same time
    // from overwriting each other's request.
    storageGet(KEYS.leads).then(function(raw){
      var latest = DB.leads;
      if(raw){
        try{ latest = JSON.parse(raw); }catch(e){}
      }
      if(!Array.isArray(latest)) latest = [];
      latest.push(lead);
      DB.leads = latest;
      return storageSet(KEYS.leads, DB.leads);
    }).then(function(){
      // Fire off an automatic email notification to the company inbox so
      // this lead can be followed up on and offers/services can be sent.
      notifyCompanyOfLead(lead);

      container.innerHTML = "";
      container.appendChild(el("div", {class:"success-box"}, [
        el("div", {class:"ic"}, ["✓"]),
        el("h2", {style:"font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:10px;"}, ["Request Received"]),
        el("p", {style:"color:var(--slate);font-size:14.5px;margin-bottom:24px;"}, [
          "Thanks, " + name.split(" ")[0] + " — our team will review your request and reach out shortly to schedule your consultation."
        ]),
        el("a", {href:"#/", class:"btn btn-outline-dark"}, ["← Back Home"])
      ]));
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = "Request Consultation";
      showToast("Could not submit — check connection and try again.");
    });
  });

  // Sends a notification email to the company's configured contact address
  // using FormSubmit's AJAX endpoint (no backend/server needed). The very
  // first time an email is sent to a given address, FormSubmit requires a
  // one-time click on a confirmation email it sends to that address —
  // after that, all future submissions deliver automatically.
  function notifyCompanyOfLead(lead){
    var to = DB.settings.companyEmail;
    if(!to) return;
    var payload = {
      _subject: "New Consultation Request — " + lead.name,
      "Name": lead.name,
      "Company": lead.company || "—",
      "Email": lead.email,
      "Phone": lead.phone,
      "Service Interested In": lead.service,
      "Preferred Date": lead.preferredDate || "—",
      "Preferred Time": lead.preferredTime || "—",
      "Message": lead.message || "—",
      "Submitted": new Date(lead.submittedAt).toLocaleString()
    };
    fetch("https://formsubmit.co/ajax/" + encodeURIComponent(to), {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    }).catch(function(){ /* Non-fatal: the lead is already saved either way. */ });
  }
}

  var card = el("div", {class:"admin-card"});

  var pass = el("input", {type:"text", value: DB.settings.adminPasscode, style:"width:100%;padding:12px 14px;border:1px solid var(--platinum);font-family:var(--corp);margin-bottom:14px;"});
  var savePass = el("button", {class:"btn-admin sm"}, ["Update Passcode"]);
  savePass.addEventListener("click", function(){
    DB.settings.adminPasscode = pass.value.trim() || DB.settings.adminPasscode;
    persist("settings"); showToast("Passcode updated.");
  });
  card.appendChild(pass); card.appendChild(savePass);
  card.appendChild(el("p", {class:"tiny-note"}, ["This passcode gates the admin panel in-browser. Share it only with people who should be able to edit the site."]));
  wrap.appendChild(card);

  var card2 = el("div", {class:"admin-card"});
  card2.appendChild(el("h3", {}, ["Company Contact"]));
  card2.appendChild(textField("Contact Email", DB.settings.companyEmail, function(v){ DB.settings.companyEmail = v; }));
  card2.appendChild(textField("Public Domain", DB.settings.companyDomain, function(v){ DB.settings.companyDomain = v; }));
  var save2 = el("button", {class:"btn-admin sm"}, ["Save"]);
  save2.addEventListener("click", function(){ persist("settings"); showToast("Settings saved."); });
  card2.appendChild(save2);
  wrap.appendChild(card2);

  var card3 = el("div", {class:"admin-card"});
  card3.appendChild(el("h3", {}, ["Share This Site"]));
  card3.appendChild(el("p", {style:"font-size:13.5px;color:var(--slate);margin-bottom:14px;"}, ["Share the artifact link with anyone — they'll see the live public site. Only people with the admin passcode can edit content."]));
  wrap.appendChild(card3);

  if(!HAS_STORAGE){
    var warn = el("div", {class:"admin-card", style:"border-color:#b23b3b;"});
    warn.appendChild(el("h3", {style:"color:#b23b3b;"}, ["Storage Unavailable"]));
    warn.appendChild(el("p", {style:"font-size:13px;color:var(--slate);"}, ["Persistent storage isn't available in this environment right now, so changes will only last for this browsing session."]));
    wrap.appendChild(warn);
  }
  return wrap;
}

/* =========================================================
   MASTER RENDER
========================================================= */
function render(){
  var parts = parseHash();
  if(parts[0] === "admin"){ renderAdmin(); return; }
  renderPublic(parts);
}

/* =========================================================
   BOOT
========================================================= */
loadAll().then(function(){
  // One-time forced update: make sure the live company email matches the
  // requested address even if an older value was already saved in storage.
  if(DB.settings.companyEmail !== "christopherloyola56@gmail.com"){
    DB.settings.companyEmail = "christopherloyola56@gmail.com";
    persist("settings");
  }
  render();
}).catch(function(){
  render();
});

})();

</script>
