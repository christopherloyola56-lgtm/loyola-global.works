<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGW Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font:14px Montserrat,Arial}.serif{font-family:"Cormorant Garamond",Georgia,serif}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#111;color:#fff;padding:30px 20px}.side img{width:190px;margin-bottom:35px}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#bbb;padding:13px 10px;cursor:pointer;font:600 11px Montserrat;text-transform:uppercase;letter-spacing:.1em}.side button.active,.side button:hover{color:#fff;background:#292929}.main{padding:40px;max-width:1200px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.top h1{font:600 48px "Cormorant Garamond";margin:0}.btn{border:1px solid #111;background:#111;color:#fff;padding:12px 18px;font:600 11px Montserrat;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}.btn.light{background:#fff;color:#111}.panel{background:#fff;border:1px solid #ddd;padding:28px;margin-bottom:22px}.panel h2{font:600 32px "Cormorant Garamond";margin:0 0 20px}.field{margin-bottom:16px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ccc;font:inherit}.field textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.item{border-top:1px solid #ddd;padding:18px 0}.item-head{display:flex;justify-content:space-between;gap:15px}.muted{color:#777;font-size:12px;line-height:1.6}.row-actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#fff;color:#111;border-color:#999}.asset{display:grid;grid-template-columns:160px 1fr;gap:25px;align-items:center}.asset img{max-width:160px;max-height:100px;object-fit:contain;background:#111;padding:10px}.login{min-height:100vh;display:grid;place-items:center;background:#111}.loginbox{background:#fff;width:min(420px,90%);padding:40px}.loginbox img{width:180px;background:#111;padding:10px;margin-bottom:20px}.notice{padding:13px;background:#f0f0f0;color:#555;font-size:12px;line-height:1.6;margin-bottom:18px}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:static}.main{padding:20px}.grid{grid-template-columns:1fr}.asset{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script>
const KEY="lgw_db",APP="lgw_apps";const DEF=JSON.parse(localStorage.getItem(KEY)||"null");let db=DEF||null;
const DEFAULT={site:{company:"LOYOLA GLOBAL WORKS",tagline:"CONNECTING TALENT. POWERING BUSINESS.",heroKicker:"GLOBAL TALENT. REAL IMPACT.",heroTitle:"Connecting Talent. Powering Business.",heroText:"Loyola Global Works helps businesses build stronger teams through exceptional global talent and dependable outsourcing solutions.",aboutTitle:"People. Purpose. Performance.",aboutText:"Loyola Global Works connects businesses with exceptional talent and reliable operational support, helping organizations scale through people, expertise, and technology.",contactEmail:"hello@loyolaglobalworks.com",contactPhone:"+63 912 345 6789",website:"www.loyolaglobalworks.com"},services:[["◯","Virtual Assistance","Administrative and executive support designed around your workflow."],["◌","Customer Support","Reliable professionals representing your brand with care and consistency."],["▧","Back-Office Operations","Helping businesses manage essential processes efficiently."],["⌁","Creative Services","Design, content, and digital support for growing brands."],["♧","Staffing & Talent Solutions","Connecting businesses with skilled professionals ready to contribute."]],team:[["Christopher Loyola","Founder & CEO","People, strategy, and long-term growth."],["Operations Lead","Operations Lead","Keeping delivery, processes, and performance moving."],["Talent Director","Talent Director","Building exceptional teams and talent experiences."],["Client Success","Client Success","Creating trusted partnerships and measurable outcomes."]],jobs:[],assets:{logo:"assets/logo-horizontal.png",monogram:"assets/logo-monogram-dark.png",hero:"assets/hero-lgw.png"}};
if(!db){db=DEFAULT;localStorage.setItem(KEY,JSON.stringify(db))}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function login(){const v=document.getElementById("pw").value;if(v==="LGW-admin"){sessionStorage.lgw=1;draw()}else alert("Incorrect admin password.")}
function logout(){sessionStorage.removeItem("lgw");location.reload()}
function draw(){if(!sessionStorage.lgw){document.getElementById("root").innerHTML=`<div class="login"><div class="loginbox"><img src="assets/logo-horizontal.png"><h2 class="serif" style="font-size:38px">Admin Access</h2><div class="notice">Demo administrator access for this prototype. Production authentication should be moved to a secure server/database.</div><div class="field"><label>Password</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn" onclick="login()">Enter Admin</button></div></div>`;return}
document.getElementById("root").innerHTML=`<div class="shell"><aside class="side"><img src="${esc(db.assets.logo)}"><button onclick="tab('dashboard')" id="b-dashboard">Dashboard</button><button onclick="tab('content')" id="b-content">Website Content</button><button onclick="tab('team')" id="b-team">Leadership / Talent</button><button onclick="tab('jobs')" id="b-jobs">Job Openings</button><button onclick="tab('applications')" id="b-applications">Applications</button><button onclick="tab('assets')" id="b-assets">Brand Assets</button><button onclick="location.href='index.html'">View Website ↗</button><button onclick="logout()">Sign Out</button></aside><main class="main" id="main"></main></div>`;tab("dashboard")}
function tab(t){document.querySelectorAll(".side button").forEach(x=>x.classList.remove("active"));document.getElementById("b-"+t)?.classList.add("active");({dashboard,content,team,jobs,applications,assets}[t])()}
function head(title,sub=""){return `<div class="top"><div><h1 class="serif">${title}</h1><div class="muted">${sub}</div></div><div class="row-actions"><button class="btn light" onclick="save()">Save Draft</button><button class="btn" onclick="publish()">Publish</button></div></div>`}
function publish(){localStorage.setItem("lgw_published",JSON.stringify(db));alert("Published draft to the public site in this browser.")}
function dashboard(){main.innerHTML=head("Dashboard","Manage Loyola Global Works content, leadership, careers, applications and brand assets.")+`<div class="grid"><div class="panel"><h2>Website</h2><p class="muted">Edit the homepage, services, leadership and brand assets from the admin panels.</p><button class="btn" onclick="tab('content')">Edit Content</button></div><div class="panel"><h2>Careers</h2><p class="muted">${db.jobs.length} open position(s). Add unlimited positions and customize each application form.</p><button class="btn" onclick="tab('jobs')">Manage Jobs</button></div></div>`}
function content(){main.innerHTML=head("Website Content","All primary homepage copy is editable.")+`<div class="panel"><h2>Hero & About</h2>${field("Hero kicker","heroKicker",db.site.heroKicker)}${field("Hero title","heroTitle",db.site.heroTitle)}${field("Hero supporting text","heroText",db.site.heroText,true)}${field("About title","aboutTitle",db.site.aboutTitle)}${field("About text","aboutText",db.site.aboutText,true)}${field("Contact email","contactEmail",db.site.contactEmail)}${field("Contact phone","contactPhone",db.site.contactPhone)}${field("Website","website",db.site.website)}<button class="btn" onclick="saveSite()">Save Content</button></div><div class="panel"><h2>Services</h2>${db.services.map((x,i)=>`<div class="item"><div class="grid">${field("Service name","svcname"+i,x[1])}${field("Description","svcdesc"+i,x[2],true)}</div></div>`).join("")}<button class="btn" onclick="saveServices()">Save Services</button></div>`}
function field(label,id,value,area=false){return `<div class="field"><label>${label}</label>${area?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}">`}</div>`}
function saveSite(){["heroKicker","heroTitle","heroText","aboutTitle","aboutText","contactEmail","contactPhone","website"].forEach(k=>db.site[k]=document.getElementById(k).value);save();alert("Saved draft.")}
function saveServices(){db.services.forEach((x,i)=>{x[1]=document.getElementById("svcname"+i).value;x[2]=document.getElementById("svcdesc"+i).value});save();alert("Saved draft.")}
function team(){main.innerHTML=head("Leadership / Talent","Publish the major people in the company.")+db.team.map((t,i)=>`<div class="panel"><div class="grid">${field("Name","tn"+i,t[0])}${field("Role","tr"+i,t[1])}</div>${field("Bio","tb"+i,t[2],true)}<button class="btn" onclick="saveTeam()">Save Team</button></div>`).join("")}
function saveTeam(){db.team.forEach((t,i)=>{t[0]=document.getElementById("tn"+i).value;t[1]=document.getElementById("tr"+i).value;t[2]=document.getElementById("tb"+i).value});save();alert("Team saved.")}
function jobs(){main.innerHTML=head("Job Openings","Unlimited positions. Each job can have its own landing/application fields.")+`<div class="panel"><h2>Add New Position</h2><div class="grid">${field("Position title","newtitle","")}${field("Department","newdept","Operations")}${field("Location","newloc","Remote · Philippines")}${field("Employment type","newtype","Full-time")}</div>${field("Description","newdesc","")}<button class="btn" onclick="addJob()">Add Position</button></div>`+db.jobs.map(j=>`<div class="panel"><div class="item-head"><div><h2>${esc(j.title)}</h2><div class="muted">${esc(j.department)} · ${esc(j.location)} · ${esc(j.type)}</div></div><div class="row-actions"><button class="btn light" onclick="editJob('${j.id}')">Edit</button><button class="btn danger" onclick="deleteJob('${j.id}')">Delete</button></div></div><p class="muted">${esc(j.description)}</p><strong>Application fields: ${j.fields.length}</strong></div>`).join("")}
function addJob(){const j={id:"job-"+Date.now(),title:document.getElementById("newtitle").value||"New Position",department:document.getElementById("newdept").value,location:document.getElementById("newloc").value,type:document.getElementById("newtype").value,description:document.getElementById("newdesc").value,fields:[["fullName","Full Name","text",true],["email","Email Address","email",true],["resume","Resume / CV","file",true],["message","Tell us about yourself","textarea",true]]};db.jobs.push(j);save();jobs()}
function deleteJob(id){if(confirm("Delete this position?")){db.jobs=db.jobs.filter(j=>j.id!==id);save();jobs()}}
function editJob(id){const j=db.jobs.find(x=>x.id===id);main.innerHTML=head("Edit Position","Modify the job landing page content and application form.")+`<div class="panel">${field("Position title","et",j.title)}<div class="grid">${field("Department","ed",j.department)}${field("Location","el",j.location)}${field("Employment type","ee",j.type)}</div>${field("Description","ex",j.description,true)}<button class="btn" onclick="saveJob('${id}')">Save Position</button></div><div class="panel"><h2>Application Fields</h2><div class="notice">Add as many fields as you need. Changes are applied to this job's application landing page.</div><div id="fields">${j.fields.map((f,i)=>`<div class="item"><div class="grid">${field("Field label","fl"+i,f[1])}${field("Field type","ft"+i,f[2])}</div><label style="font-size:10px"><input id="fr${i}" type="checkbox" ${f[3]?"checked":""}> Required</label></div>`).join("")}</div><button class="btn light" onclick="addField('${id}')">+ Add Field</button> <button class="btn" onclick="saveFields('${id}')">Save Fields</button></div>`}
function saveJob(id){const j=db.jobs.find(x=>x.id===id);j.title=et.value;j.department=ed.value;j.location=el.value;j.type=ee.value;j.description=ex.value;save();alert("Job saved.")}
function addField(id){const j=db.jobs.find(x=>x.id===id);j.fields.push(["field"+Date.now(),"New Field","text",false]);save();editJob(id)}
function saveFields(id){const j=db.jobs.find(x=>x.id===id);j.fields.forEach((f,i)=>{f[1]=document.getElementById("fl"+i).value;f[2]=document.getElementById("ft"+i).value;f[3]=document.getElementById("fr"+i).checked});save();alert("Application fields saved.")}
function applications(){const a=JSON.parse(localStorage.getItem(APP)||"[]");main.innerHTML=head("Applications","Applications submitted through this browser's prototype storage.")+(a.length?a.map(x=>{const j=db.jobs.find(y=>y.id===x.jobId);return `<div class="panel"><h2>${esc(j?.title||x.jobId)}</h2><div class="muted">${new Date(x.submitted).toLocaleString()}</div><pre style="white-space:pre-wrap;font:12px Montserrat;margin-top:20px">${esc(JSON.stringify(x.values,null,2))}</pre></div>`}).join(""):`<div class="panel"><h2>No applications yet.</h2><p class="muted">Applications will appear here after someone submits an application form.</p></div>`)}
function assets(){main.innerHTML=head("Brand Assets","Upload replacement logos and hero imagery without changing the site's structure.")+asset("Primary Horizontal Logo","logo",db.assets.logo)+asset("Monogram","monogram",db.assets.monogram)+asset("Hero Image","hero",db.assets.hero)}
function asset(label,key,path){return `<div class="panel asset"><img src="${esc(path)}"><div><h2>${label}</h2><div class="muted">Current: ${esc(path)}</div><input type="file" accept="image/*" onchange="uploadAsset(event,'${key}')"></div></div>`}
function uploadAsset(e,key){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{db.assets[key]=r.result;save();alert("Asset saved to draft. Publish when ready.");assets()};r.readAsDataURL(file)}
draw();
</script></body></html>
